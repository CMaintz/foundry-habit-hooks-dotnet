# Publish to PyPI on a version tag via Trusted Publishing (OIDC). No API token is
# stored anywhere: PyPI mints a short-lived credential for this exact repo + workflow.
# Set up the matching publisher once at
# https://pypi.org/manage/project/foundry-habit-hooks-dotnet/settings/publishing/
# (owner CMaintz, repo foundry-habit-hooks-dotnet, workflow release.yml, no environment).
#
# To cut a release: bump `version` in pyproject.toml (keep it == habit-hooks core
# major.minor), commit, then `git tag vX.Y.Z && git push origin vX.Y.Z`.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC credential for Trusted Publishing
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
